@if (vm$ | async; as vm) {
<!-- Navigation is owned by the persistent outlet in LayoutComponent. -->
@if (vm.isLoggedIn) {
<ion-tab-bar slot="bottom" class="mf-tabs">
  @for (tab of visibleTabs; track tab.id; let i = $index) { @if (i ===
  addSlotIndex) {
  <span class="mf-tabs__gap" aria-hidden="true"></span>
  }
  <ion-tab-button
    (click)="navigateTab(tab.routerLink, $event)"
    [class.tab-selected]="isActiveTab(tab.routerLink, vm.activeRoute)"
    [selected]="isActiveTab(tab.routerLink, vm.activeRoute)"
  >
    <ion-icon
      aria-hidden="true"
      [name]="
        isActiveTab(tab.routerLink, vm.activeRoute)
          ? tab.icon
          : tab.icon + '-outline'
      "
    ></ion-icon>
    <span class="mf-tabs__label">{{ tab.label ?? "" | translate }}</span>
  </ion-tab-button>
  }
</ion-tab-bar>
<button
  type="button"
  class="mf-tabs__add"
  [style.--mf-tabs-count]="visibleTabs.length"
  [style.--mf-add-index]="addSlotIndex"
  (click)="addTransaction()"
  [attr.aria-label]="'LEDGER.ADD_TRANSACTION' | translate"
>
  <span class="mf-tabs__add-mark" aria-hidden="true">
    <ion-icon name="add"></ion-icon>
  </span>
</button>

} }
