<div class="date-range-selector" role="radiogroup" aria-label="Select a date range">
  @for (range of ranges; track range) {
    <button
      [class.selected]="range.value === selectedRange"
      (click)="selectRange(range.value)"
      type="button"
      role="radio"
      [attr.aria-checked]="range.value === selectedRange"
      >
      {{ range.label | translate }}
    </button>
  }
</div>
