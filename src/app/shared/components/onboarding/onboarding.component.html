<div
  class="onboarding-page mf-onb"
  [dir]="translationService.getCurrentLanguage() === 'ar' ? 'rtl' : 'ltr'"
>
  <!-- Top actions -->
  <div class="mf-onb__top">
    <button type="button" class="mf-onb__lang" (click)="toggleLanguage()">
      <ion-icon name="globe-outline" aria-hidden="true"></ion-icon>
      <span>{{
        translationService.getCurrentLanguage() === "ar" ? "English" : "العربية"
      }}</span>
    </button>
    <button
      type="button"
      class="mf-onb__skip"
      (click)="skip()"
      [class.mf-onb__skip--hidden]="isLastStep"
      [attr.aria-hidden]="isLastStep"
      [attr.tabindex]="isLastStep ? -1 : null"
    >
      {{ "ONBOARDING.SKIP" | translate }}
    </button>
  </div>

  <!-- Slides (horizontal scroll-snap) -->
  <div class="slides-viewport">
    <div class="slides-container" #slidesContainer (scroll)="onScroll($event)">
      @for (step of steps; track step; let i = $index) {
      <section
        class="slide"
        [class.active-slide]="i === currentStepIndex"
        [attr.aria-hidden]="i !== currentStepIndex"
      >
        <div class="mf-onb__slide">
          @if (i === 0) {
          <img
            src="assets/icon/icon.png"
            [alt]="brandParams.productName"
            class="mf-onb__logo"
          />
          } @else {
          <span
            class="mf-onb__mark"
            [style.--mf-onb-tone]="'var(--mf-cat-' + (((i - 1) % 6) + 1) + ')'"
            aria-hidden="true"
          >
            <ion-icon [name]="step.icon"></ion-icon>
          </span>
          }
          <h2 class="mf-onb__title">
            {{ step.title | translate : brandParams }}
          </h2>
          <p class="mf-onb__desc">{{ step.description | translate }}</p>
        </div>
      </section>
      }
    </div>
  </div>

  <!-- Progress + primary action, in thumb reach -->
  <div class="mf-onb__bottom">
    <div class="mf-onb__dots" role="tablist">
      @for (step of steps; track step; let i = $index) {
      <button
        type="button"
        class="mf-onb__dot"
        role="tab"
        [class.mf-onb__dot--on]="i === currentStepIndex"
        [attr.aria-selected]="i === currentStepIndex"
        [attr.aria-label]="(i + 1) + ' / ' + steps.length"
        (click)="goToStep(i)"
      ></button>
      }
    </div>
    <button type="button" class="mf-onb__next" (click)="next()">
      <span>{{
        (isLastStep ? "ONBOARDING.START" : "ONBOARDING.NEXT") | translate
      }}</span>
      <ion-icon
        [name]="isLastStep ? 'checkmark' : 'arrow-forward'"
        aria-hidden="true"
      ></ion-icon>
    </button>
  </div>
</div>
