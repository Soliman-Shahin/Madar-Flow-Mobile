ext {
    minSdkVersion = 24
    // Google Play requires new apps and updates to target Android 16 (API 36) since 2026-08-31.
    // compileSdk 37 (the "android-37.0" platform) lacks android.hardware.fingerprint, which the
    // native-biometric plugin needs, so compile against 36 (Capacitor 8's own default).
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.7.0'
    // Downgrade to avoid D8 NPE with 1.7.0 in AGP 8.0/Gradle 8.0.2
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    // Capacitor 8 uses AndroidX APIs introduced after core 1.12.
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.5.6'
    coreSplashScreenVersion = '1.0.0'
    androidxWebkitVersion = '1.6.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}
