apply plugin: 'com.android.application'

// Release signing. The upload keystore and its passwords live OUTSIDE the repository.
// Point MADARFLOW_KEYSTORE_PROPERTIES (env var) or -PmadarflowKeystoreProperties at a
// .properties file with: storeFile, storePassword, keyAlias, keyPassword.
def keystorePropsPath = System.getenv('MADARFLOW_KEYSTORE_PROPERTIES') ?: findProperty('madarflowKeystoreProperties')
def keystoreProps = new Properties()
def hasReleaseSigning = false
if (keystorePropsPath && file(keystorePropsPath).exists()) {
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
    hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProps[it] }
}

android {
    packagingOptions {
        resources {
            excludes += ['META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
    namespace "com.orbitmadar.madarflow"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.orbitmadar.madarflow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Enforce AndroidX versions compatible with compileSdk 34
configurations.configureEach {
    resolutionStrategy {
        force(
            "androidx.core:core:$androidxCoreVersion",
            "androidx.core:core-ktx:$androidxCoreVersion",
            // Avoid D8 NPE by staying on appcompat 1.6.1 with AGP 8.0/Gradle 8.0.2
            "androidx.appcompat:appcompat:$androidxAppCompatVersion",
            "androidx.appcompat:appcompat-resources:$androidxAppCompatVersion"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Pin core and core-ktx to versions compatible with compileSdk 34 to satisfy AAR metadata checks
    implementation "androidx.core:core:$androidxCoreVersion"

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-identity:18.1.0'

    // Required for Google Sign-In
    implementation 'com.google.android.gms:play-services-base:18.7.2'
    implementation 'com.google.android.gms:play-services-basement:18.7.1'
    implementation 'com.google.android.gms:play-services-tasks:18.3.2'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.2.0'
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
